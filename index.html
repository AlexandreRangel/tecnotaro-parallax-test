<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<title>Tecnotarô Parallax deck</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;perspective:1400px;box-sizing:border-box;
 padding:calc(44px + env(safe-area-inset-top)) env(safe-area-inset-right) calc(52px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
 background:radial-gradient(ellipse at 50% 40%,#1a0b24 0%,#000 70%)}
#card{position:relative;height:min(100%,calc((100vw - 16px)*12/7));aspect-ratio:7/12;transform-style:preserve-3d;will-change:transform;transition:opacity .18s}
#card img{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none}
#win{position:absolute;left:8.080%;top:9.740%;width:84.464%;height:80.469%;overflow:hidden;border-radius:4%/2.5%;background:#000}
#bg{left:-5%;top:-5%;width:110%;height:110%}
#mid,#fg{left:0;top:0;width:100%;height:100%}
#fg{mix-blend-mode:screen}
#frame{left:0;top:0;width:100%;height:100%}
.layer{will-change:transform}
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;z-index:6;color:#ffd58a}
#top{top:0;height:44px;padding-top:env(safe-area-inset-top)}
#bot{bottom:0;height:52px;padding-bottom:env(safe-area-inset-bottom)}
.btn{font:600 15px/1 inherit;color:#fff;background:#ffffff14;border:1px solid #c9a24a88;border-radius:999px;padding:10px 16px}
#name{font-size:14px;letter-spacing:.06em;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud{font-size:11px;color:#fff6;text-align:center;flex:1}
#start{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:9;
 font:600 18px/1.3 -apple-system,system-ui,sans-serif;color:#ffd58a;text-align:center}
#start button{font:inherit;font-size:20px;letter-spacing:.08em;padding:16px 34px;border-radius:999px;border:2px solid #c9a24a;color:#fff;
 background:linear-gradient(135deg,#ff2bc8,#20d8ff);box-shadow:0 0 24px #ff2bc8aa,0 0 40px #20d8ff66}
#start small{color:#9fdcff;font-weight:400;max-width:80vw}
#index{position:fixed;inset:0;z-index:8;background:#05030aee;overflow-y:auto;display:none;padding:calc(10px + env(safe-area-inset-top)) 10px 30px;touch-action:pan-y;box-sizing:border-box}
#index.on{display:block}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
#grid a{display:block;color:#ffd58a;font-size:10px;text-align:center;text-decoration:none}
#grid img{width:100%;aspect-ratio:7/12;object-fit:cover;border-radius:6px;border:1px solid #c9a24a55;background:#111}
#index h2{color:#ffd58a;font-size:16px;margin:4px 4px 10px;display:flex;justify-content:space-between;align-items:center}
</style></head><body>
<div id="top" class="bar"><button class="btn" id="idx">Index</button><div id="name"></div><button class="btn" id="rc">Recenter</button></div>
<div id="card">
 <div id="win"><img id="bg" class="layer" alt=""><img id="mid" class="layer" alt=""><img id="fg" class="layer" alt=""></div>
 <img id="frame" alt="">
</div>
<div id="bot" class="bar"><button class="btn" id="prev">&#9664; Prev</button><div id="hud"></div><button class="btn" id="next">Next &#9654;</button></div>
<div id="index"><h2>Tecnotarô, 78 cards <button class="btn" id="close">Close</button></h2><div id="grid"></div></div>
<div id="start"><button id="go">Tap to start</button><small>Tilt the phone to look into the card. Swipe or use Prev/Next to change cards. On desktop, move the mouse and use the arrow keys.</small></div>
<script>
// Depth bands (manifest.json): bg far, moves most and opposite | mid = figure + ground, zero plane | fg near, small, with the tilt.
// offset = tilt(-1..1, clamped) * depth * window width, both axes. Depths are clamped per card by its halo margin.
const TILT=4, MAXDEG=22, LERP=0.10;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id), card=$('card'), win=$('win'), hud=$('hud');
let deck=[], cur=0, DEPTH={bg:-0.02,mid:0,fg:0.01};
let tx=0,ty=0,x=0,y=0,base=null,mode='none';
const clamp=v=>Math.max(-1,Math.min(1,v));
const src=(c,n)=>`deck/${c.id}/${n}.webp`;
function show(i){
  cur=(i+deck.length)%deck.length; const c=deck[cur];
  card.style.opacity=.35;
  const ims=['bg','mid','fg','frame'].map(n=>new Promise(r=>{const im=new Image(); im.onload=im.onerror=r; im.src=src(c,n);}));
  Promise.all(ims).then(()=>{ if(deck[cur]!==c) return;
    for(const n of ['bg','mid','fg','frame']) $(n).src=src(c,n);
    DEPTH=c.depth; card.style.opacity=1; });
  $('name').textContent=`${String(c.index).padStart(2,'0')} ${c.title}`;
  history.replaceState(null,'','#'+String(c.index).padStart(2,'0'));
  for(const k of [1,-1]){ const n=deck[(cur+k+deck.length)%deck.length]; for(const l of ['bg','mid','fg','frame']) new Image().src=src(n,l); }
}
function onOri(e){
  if(e.beta==null) return;
  let g=e.gamma,b=e.beta;
  if(!base){base={g,b}; mode='gyro'; hud.textContent='gyro on';}
  let dg=g-base.g, db=b-base.b; if(dg>90)dg-=180; if(dg<-90)dg+=180;
  tx=clamp(dg/MAXDEG); ty=clamp(db/MAXDEG);
}
addEventListener('mousemove',e=>{ if(mode==='gyro')return; mode='mouse'; tx=clamp(e.clientX/innerWidth*2-1); ty=clamp(e.clientY/innerHeight*2-1); });
addEventListener('mouseleave',()=>{if(mode==='mouse'){tx=0;ty=0;}});
// touch: quick horizontal swipe changes card; otherwise (no gyro) drag explores depth
let t0=null;
addEventListener('touchstart',e=>{ if($('index').classList.contains('on'))return; const t=e.touches[0]; t0={x:t.clientX,y:t.clientY,t:Date.now()}; },{passive:true});
addEventListener('touchmove',e=>{ if(!t0||mode==='gyro')return; const t=e.touches[0]; tx=clamp((t.clientX-t0.x)/120); ty=clamp((t.clientY-t0.y)/120); },{passive:true});
addEventListener('touchend',e=>{ if(!t0)return; const t=e.changedTouches[0], dx=t.clientX-t0.x, dy=t.clientY-t0.y;
  if(Math.abs(dx)>60 && Math.abs(dx)>1.5*Math.abs(dy) && Date.now()-t0.t<600) show(cur+(dx<0?1:-1));
  if(mode!=='gyro'){tx=0;ty=0;} t0=null; });
addEventListener('keydown',e=>{ if(e.key==='ArrowRight')show(cur+1); if(e.key==='ArrowLeft')show(cur-1); });
$('prev').onclick=()=>show(cur-1); $('next').onclick=()=>show(cur+1);
$('rc').onclick=()=>{base=null;};
$('idx').onclick=()=>$('index').classList.add('on'); $('close').onclick=()=>$('index').classList.remove('on');
async function start(){
  $('start').style.display='none';
  if(reduce){hud.textContent='Reduce Motion on: static';return;}
  if(typeof DeviceOrientationEvent!=='undefined'){
    try{
      if(typeof DeviceOrientationEvent.requestPermission==='function'){
        const r=await DeviceOrientationEvent.requestPermission();
        if(r!=='granted'){hud.textContent='no motion permission: drag';return;}
      }
      addEventListener('deviceorientation',onOri);
    }catch(err){hud.textContent='gyro unavailable: drag';}
  }
}
$('go').onclick=start;
const L={bg:$('bg'),mid:$('mid'),fg:$('fg')};
function tick(){
  x+=(tx-x)*LERP; y+=(ty-y)*LERP; const w=win.clientWidth;
  for(const k in L) L[k].style.transform=`translate3d(${(x*DEPTH[k]*w).toFixed(2)}px,${(y*DEPTH[k]*w).toFixed(2)}px,0)`;
  card.style.transform=`rotateY(${(x*TILT).toFixed(2)}deg) rotateX(${(-y*TILT).toFixed(2)}deg)`;
  requestAnimationFrame(tick);
}
fetch('manifest.json').then(r=>r.json()).then(m=>{
  deck=m.cards;
  $('grid').innerHTML=deck.map((c,i)=>`<a href="#${String(c.index).padStart(2,'0')}" data-i="${i}"><img loading="lazy" src="deck/${c.id}/thumb.webp" alt=""><br>${String(c.index).padStart(2,'0')} ${c.title}</a>`).join('');
  $('grid').onclick=e=>{const a=e.target.closest('a'); if(!a)return; e.preventDefault(); $('index').classList.remove('on'); show(+a.dataset.i);};
  const h=parseInt(location.hash.slice(1)); show(isNaN(h)?0:Math.max(0,deck.findIndex(c=>c.index===h)));
  if(!reduce) requestAnimationFrame(tick);
});
</script>
</body></html>
